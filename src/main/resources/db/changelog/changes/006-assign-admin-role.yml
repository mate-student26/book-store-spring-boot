databaseChangeLog:
  - changeSet:
      id: 005-assign-admin-role
      author: mate-student26
      changes:
        - sql: >
            INSERT INTO users_roles (user_id, role_id)
            SELECT u.id, r.id
            FROM users u
            JOIN roles r ON r.role = 'ADMIN'
            WHERE u.email = 'admin@admin.com'            
